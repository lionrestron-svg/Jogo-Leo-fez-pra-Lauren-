<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobrinha Relâmpago</title>
<style>
:root{--bg:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b4d20}}
:root[data-theme="dark"]{--bg:#1b4d20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 64px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7);z-index:5}
#hp{font-size:20px;letter-spacing:1px;background:rgba(0,0,0,.3);border-radius:14px;padding:3px 10px}
#sc{font-size:24px;font-weight:800;background:rgba(0,0,0,.3);border-radius:14px;padding:2px 12px}
#fx{font-size:18px;font-weight:700;min-width:70px;text-align:right}
#bst{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 46px);font-size:13px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.7);pointer-events:none;z-index:5}
#mm{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 52px);width:128px;height:128px;border-radius:8px;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:5;pointer-events:none}
#pbtn{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(0,0,0,.4);color:#fff;font-size:22px;padding:0;z-index:11;display:none}
#pm{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,18,28,.72)}#pm h2{margin:0 0 6px;font-size:28px}#pm .big{width:240px}
#hint{position:fixed;left:0;right:0;bottom:calc(330px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.8);pointer-events:none}
#over{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,18,28,.78);text-align:center;padding:20px}
#over h2{margin:0;font-size:26px}
#over button,.big{font-size:19px;padding:13px 28px;border:0;border-radius:14px;background:#ffd93d;color:#06263a;font-weight:700}
#over button.alt,.big.alt{background:#ffffff33;color:#fff}
#pad{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:repeat(3,96px);gap:4px;touch-action:none;padding:10px;margin-bottom:-10px}
#pad::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:rgba(255,255,255,.1)}
#pad button{border:2px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(255,255,255,.26);color:#fff;font-size:38px;padding:0;pointer-events:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#pad button.on{background:rgba(255,255,255,.55);transform:scale(.94)}
#u{grid-area:1/2}#l{grid-area:2/1}#r{grid-area:2/3}#d{grid-area:3/2}
#menu{position:fixed;inset:0;z-index:20;background:linear-gradient(#3f9b45,#1b5e20);display:flex;overflow-y:auto;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:30px;font-weight:800;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .4s;z-index:9}
#nms{display:grid;gap:8px;width:100%}#nms label{display:flex;flex-direction:column;text-align:left;font-size:13px;gap:3px}
#nms input{font-size:16px;padding:9px 12px;border-radius:10px;border:0;-webkit-user-select:text;user-select:text}
#mhome,#medit,#mctl,#mview{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;text-align:center;margin:auto;padding:20px 0}
#medit,#mctl,#mview{display:none}
.big.sel{outline:3px solid #ffd93d}#cdesc{font-size:14px;opacity:.9;margin:0}
#menu h1{font-size:38px;line-height:1.1;margin:0 0 18px;text-shadow:0 3px 8px rgba(0,0,0,.4)}
#menu h2{margin:0}#menu p{margin:6px 0 0;font-weight:600}
#mhome .big{width:100%}
.sws{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #ffffff66;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px #ffd93d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mm" width="128" height="128"></canvas>
<button id="pbtn" aria-label="Pausa e menu">☰</button>
<div id="pm"><h2>⏸ Pausado</h2><button id="pc" class="big">▶ Continuar</button><button id="pr" class="big alt">🔄 Reiniciar</button><button id="pmn" class="big alt">🏠 Menu</button></div>
<div id="bst"></div>
<div id="hud"><span id="hp"></span><span id="sc">⚡ 0</span><span id="fx"></span></div>
<div id="banner"></div>
<div id="hint">Use os botões para começar</div>
<div id="over"><h2 id="msg"></h2><div id="fin"></div><button id="re">Reiniciar</button><button id="mn" class="alt">Menu</button></div>
<div id="pad">
  <button id="u" aria-label="Cima">▲</button><button id="l" aria-label="Esquerda">◀</button>
  <button id="r" aria-label="Direita">▶</button><button id="d" aria-label="Baixo">▼</button>
</div>
<div id="menu">
  <div id="mhome"><h1>⚡ Cobrinha<br>Relâmpago</h1><p id="rec" style="margin:-8px 0 8px;font-weight:700"></p>
    <button id="play" class="big">Iniciar jogo</button>
    <button id="edit" class="big alt">Editar cobra</button>
    <button id="ctl" class="big alt">Controle</button>
    <button id="viewb" class="big alt">Visão</button>
    <button id="snd" class="big alt"></button></div>
  <div id="mctl"><h2>Controle</h2>
    <button id="c1" class="big alt" style="width:100%">🎮 Botões (normal)</button>
    <button id="c2" class="big alt" style="width:100%">👆 Deslizar o dedo</button>
    <p id="cdesc"></p><button id="back2" class="big">Voltar</button></div>
  <div id="mview"><h2>Visão</h2>
    <button id="v1" class="big alt" style="width:100%">🌳 Normal (de cima)</button>
    <button id="v2" class="big alt" style="width:100%">🎥 Terceira pessoa (estilo GTA)</button>
    <p id="vdesc" id="cdesc" style="font-size:14px;margin:0"></p><button id="back3" class="big">Voltar</button></div>
  <div id="medit"><h2>Editar cobra</h2>
    <p>Sua cobra</p><div id="swme" class="sws"></div>
    <p>Cobras inimigas</p><div id="swfoe" class="sws"></div>
    <p>Nomes (aparecem em cima da cabeça)</p><div id="nms"></div>
    <button id="back" class="big" style="margin-top:14px">Voltar</button></div>
</div>
<script>
const N=100,C=N/2,MS=128,M=MS/N,TICK=140,FAST=85,ETICK=270,EFAST=190;
const $=id=>$d[id]||($d[id]=document.getElementById(id)),$d={};
const cv=$('c'),ctx=cv.getContext('2d'),mctx=$('mm').getContext('2d'),mmb=document.createElement('canvas');
mmb.width=mmb.height=128;const mbx=mmb.getContext('2d');
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const ME=['rainbow','#4fc3f7','#ef4444','#facc15','#ec4899','#a855f7','#fb923c','#ffffff','#a3e635'];
const FOE=['#111111','#6b7280','#7f1d1d','#581c87','#78350f','#1e3a8a','#14532d','#be185d'];
const DEF=['Você','Sombra','Breu','Noite','Carvão'],LBL=['Sua cobra','Inimiga 1','Inimiga 2','Inimiga 3','Inimiga 4'];
const MAPS={main:{n:'🌿 Mapa Principal',g:[['t','fire'],['r','ice'],['l','desert'],['b','stone']]},
fire:{n:'🔥 Mapa de Fogo',g:[['b','main']],hz:'lava',dmg:1,th:{h:14,s:30,l:15,d:'rgba(255,110,20,.45)'},em:'🔥'},
ice:{n:'❄️ Mapa de Gelo',g:[['l','main']],hz:'ice',dmg:.5,th:{h:200,s:40,l:76,d:'rgba(255,255,255,.75)'},em:'❄️'},
desert:{n:'🏜️ Mapa do Deserto',g:[['r','main']],hz:'cactus',dmg:.5,th:{h:40,s:55,l:60,d:'rgba(150,100,30,.4)'},em:'🏜️'},
stone:{n:'🪨 Mapa de Pedra',g:[['t','main']],hz:'spike',dmg:.5,th:{h:215,s:6,l:38,d:'rgba(0,0,0,.35)'},em:'🪨'}};
MAPS.main.th={h:112,s:40,l:32,d:'rgba(15,70,20,.5)'};MAPS.main.em='🌿';
const RECT={t:[C-1,C+1,0,11],b:[C-1,C+1,N-12,N-1],l:[0,11,C-1,C+1],r:[N-12,N-1,C-1,C+1]},LAKE={t:[C-6,C+6,0,11],b:[C-6,C+6,N-12,N-1],l:[0,11,C-6,C+6],r:[N-12,N-1,C-6,C+6]};
const LK={main:[205,70,38],fire:[16,100,48],ice:[198,75,40],desert:[28,55,26],stone:[220,18,13]};
const ARR={t:[C,2,[0,1]],b:[C,N-3,[0,-1]],l:[2,C,[1,0]],r:[N-3,C,[-1,0]]};
const POS=[[12,12],[N-12,N-12],[12,N-12],[N-12,12],[C,16],[C,N-16],[16,C],[N-16,C],[24,24],[N-24,N-24],[24,N-24],[N-24,24]];
const FLG={t:[C+2.6,12.5],b:[C+2.6,N-13.5],l:[12.5,C+2.6],r:[N-13.5,C+2.6]},FLC={fire:'#ff4a1c',ice:'#7fe3ff',desert:'#ffd24a',stone:'#aeb4bd',main:'#4cd964'};
const COL={y:'#ffd93d',g:'#00c853',b:'#1e5bff',r:'#ff1b1b',k:'#262626'};
let cfg={me:'rainbow',foe:'#111111',ctl:'pad',view:'top',snd:true,best:0};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cobrinha')||'{}'))}catch(e){}
if(cfg.view==='fp')cfg.view='tp';
cfg.best=+cfg.best||0;
cfg.names=DEF.map((d,i)=>cfg.names&&typeof cfg.names[i]==='string'?cfg.names[i]:d);
function save(){try{localStorage.setItem('cobrinha',JSON.stringify(cfg))}catch(e){}}
function names(){const el=$('nms');el.innerHTML='';LBL.forEach((l,i)=>{const lab=document.createElement('label'),inp=document.createElement('input');lab.textContent=l;inp.maxLength=10;inp.value=cfg.names[i];inp.oninput=()=>{cfg.names[i]=inp.value;save()};lab.appendChild(inp);el.appendChild(lab)})}
function sws(el,list,key){
  el.innerHTML='';
  list.forEach(c=>{const b=document.createElement('button');b.className='sw'+(cfg[key]===c?' on':'');
    b.style.background=c==='rainbow'?'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)':c;
    b.onclick=()=>{cfg[key]=c;save();sws(el,list,key)};
    el.appendChild(b)});
}
let W,Hh,S,VX,VY;
function fit(){
  const d=Math.min(devicePixelRatio||1,3);W=innerWidth;Hh=innerHeight;
  cv.width=W*d;cv.height=Hh*d;ctx.setTransform(d,0,0,d,0,0);
  S=Math.max(16,Math.min(34,Math.min(W,Hh)/14),Math.max(W,Hh)/44);VX=Math.ceil(W/S/2)+2;VY=Math.ceil(Hh/S/2)+2;
}
addEventListener('resize',fit);fit();
let snake,prevS,dir,queue,foods,enemies,fx,hp,hurtUntil,stunUntil,score,started,dead,last,acc,eacc,curTk=140,nextY,nextS,now=0,inMenu=true,camX=24,camY=24,mapId='main',hz,br,bt=0,level=0,hdg=0,lastD=0,boost=0,startBest=0,paused=false,lastT=0,pvis=null,planAt=0;
const wr=d=>d;
function hsh(x,y,k){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(k,1103515245))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967295}
let rl=[];
function build(id){
  mapId=id;hz=new Uint8Array(N*N);br=new Uint8Array(N*N);rl=[];const M=MAPS[id];
  M.g.forEach(([sd],gi)=>{const r=RECT[sd];for(let x=r[0];x<=r[1];x++)for(let y=r[2];y<=r[3];y++)br[y*N+x]=gi+1});
  if(M.hz)for(let i=0;i<70;i++){
    const ax=14+Math.floor(hsh(i,7,id.length*9)*(N-28)),ay=14+Math.floor(hsh(i,8,id.length*9)*(N-28)),rd=1+hsh(i,9,id.length*9)*1.6;
    for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++)if(x*x+y*y<=rd*rd){const ii=(ay+y)*N+ax+x;if(!br[ii]&&!POS.some(([px,py])=>py===ay+y&&ax+x>=px-3&&ax+x<=px+1))hz[ii]=1}
  }
  M.g.forEach(([sd])=>{
    const l=LAKE[sd],r=RECT[sd],v=sd==='t'||sd==='b';
    for(let x=l[0];x<=l[1];x++)for(let y=l[2];y<=l[3];y++)hz[y*N+x]=br[y*N+x]?0:2;
    if(v)for(let y=r[2];y<=r[3];y++)rl.push({x:r[0]-.5,y,ax:0,ay:1},{x:r[1]+.5,y,ax:0,ay:1});
    else for(let x=r[0];x<=r[1];x++)rl.push({x,y:r[2]-.5,ax:1,ay:0},{x,y:r[3]+.5,ax:1,ay:0});
  });
  buildMini();
}
const HZC={lava:'#ff6a00',ice:'#bdf1ff',cactus:'#2f9a45',spike:'#9aa0a8'};
function buildMini(){
  const M2=MAPS[mapId],T=M2.th;
  mbx.fillStyle='hsl('+T.h+','+Math.min(65,T.s+12)+'%,'+Math.max(16,T.l-10)+'%)';mbx.fillRect(0,0,MS,MS);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=y*N+x,v=hz[k];
    if(v===2)mbx.fillStyle='hsl('+LK[mapId][0]+',70%,38%)';else if(v===1)mbx.fillStyle=HZC[M2.hz];else continue;
    mbx.fillRect(x*M,y*M,M+.6,M+.6)}
  M2.g.forEach(([sd,to])=>{
    const l=LAKE[sd],r=RECT[sd];
    mbx.globalAlpha=.6;mbx.fillStyle=FLC[to];mbx.fillRect(l[0]*M,l[2]*M,(l[1]-l[0]+1)*M,(l[3]-l[2]+1)*M);mbx.globalAlpha=1;
    mbx.fillStyle='#e0b060';mbx.fillRect(r[0]*M,r[2]*M,(r[1]-r[0]+1)*M,(r[3]-r[2]+1)*M);
    mbx.font='16px serif';mbx.textAlign='center';mbx.textBaseline='middle';mbx.fillText(MAPS[to].em,(l[0]+l[1]+1)/2*M,(l[2]+l[3]+1)/2*M);
  });
}
function mkEnemies(){return POS.slice(0,Math.min(12,5+level)).map(([x,y])=>{const b=[{x,y},{x:x-1,y},{x:x-2,y}];return{body:b,prev:b.map(p=>({...p})),dir:[1,0],acc:0,tk:ETICK,fast:0,amb:Math.random()<.3}})}
function place(x,y,d){snake=[0,1,2].map(k=>({x:((x-d[0]*k)%N+N)%N,y:((y-d[1]*k)%N+N)%N}));prevS=snake.map(p=>({...p}));dir=d;queue=[];hdg=Math.atan2(d[1],d[0])}
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>b.style.opacity=0,1800)}
function reset(){
  level=0;boost=0;startBest=cfg.best;planAt=0;pmod.L=1;pmod.R=1;pmod.run=6;pmod.since=0;predPts=[];build('main');place(C,C,DIRS.r);enemies=mkEnemies();
  fx={spd:0,frz:0};hp=6;hurtUntil=0;stunUntil=0;foods=[];score=0;started=false;dead=false;acc=0;eacc=0;
  $('over').style.display='none';$('hint').style.display='block';$('fx').textContent='';hud();
}
function go(gi){
  const from=mapId,to=MAPS[from].g[gi][1];build(to);
  const sd=MAPS[to].g.find(g=>g[1]===from)[0],a=ARR[sd];
  place(a[0],a[1],a[2]);enemies=mkEnemies();foods=[];acc=eacc=0;hurtUntil=now+1200;nextY=nextS=now;banner(MAPS[to].n);sfx('gate');
}
function hud(){
  const lv=Math.floor(score/100);$('sc').textContent='⚡ '+score+(lv?' '+(lv<=4?'🏆'.repeat(lv):'🏆×'+lv):'');let h='';
  for(let i=0;i<6;i++)h+=hp>=i+1?'❤️':hp>=i+.5?'💔':'🖤';
  $('hp').textContent=h;
  if(score>cfg.best){cfg.best=score;save()}
  $('bst').textContent='🏅 Recorde: '+cfg.best;
}
function spawn(t,n,life,typeFn,nearN){
  const occ=new Set(snake.concat(foods,...enemies.map(e=>e.body)).map(p=>p.x+','+p.y)),hd=snake[0];
  for(let i=0;i<n;i++)for(let a=0;a<30;a++){
    const near=i<(nearN||0),r=()=>Math.floor(Math.random()*N),o=()=>Math.floor(Math.random()*21)-10;
    const x=near?Math.min(N-1,Math.max(0,hd.x+o())):r(),y=near?Math.min(N-1,Math.max(0,hd.y+o())):r(),k=x+','+y;
    if(occ.has(k)||hz[y*N+x]||br[y*N+x]||(near&&Math.abs(wr(x-hd.x))+Math.abs(wr(y-hd.y))<3))continue;
    occ.add(k);foods.push({x,y,born:t,life,type:typeFn()});break;
  }
}
const special=()=>{const r=Math.random();return r<.4?'g':r<.7?'b':'r'};
function turn(n){
  if(dead||inMenu||paused)return;
  if(cfg.view==='tp'){
    if(n==='u'||n==='d')return;
    const b=queue.length?queue[queue.length-1]:dir,v=n==='r'?[-b[1],b[0]]:[b[1],-b[0]];
    n=Object.keys(DIRS).find(k=>DIRS[k][0]===v[0]&&DIRS[k][1]===v[1]);
  }
  const d=DIRS[n],ref=queue.length?queue[queue.length-1]:dir;
  if(d[0]===-ref[0]&&d[1]===-ref[1])return;
  if(d[0]===ref[0]&&d[1]===ref[1]&&started)return;
  queue.push(d);if(queue.length>3)queue.shift();
  if(!started){started=true;last=performance.now();nextY=nextS=last;$('hint').style.display='none'}
}
function eat(f){
  if(f.type==='y')score+=10;
  else if(f.type==='g')fx.spd=now+5000;
  else if(f.type==='b')fx.frz=now+6000;
  else if(f.type==='k'){boost++;banner('🖤 Sua velocidade aumentou para sempre!')}else hp=Math.min(6,hp+1);
  sfx(f.type);checkLevel();hud();
}
function hurt(a,ms,stun){
  if(now<hurtUntil||dead)return;
  hp=Math.max(0,hp-a);hurtUntil=now+ms;if(stun)stunUntil=now+ms;hud();if(hp<=0)end();else sfx('hurt');
}
function gateAt(h){
  const b=br[h.y*N+h.x];if(!b)return -1;const sd=MAPS[mapId].g[b-1][0];
  return(sd==='t'?h.y===0:sd==='b'?h.y===N-1:sd==='l'?h.x===0:h.x===N-1)?b-1:-1;
}
function step(){
  const pd=dir;if(queue.length)dir=queue.shift();learn(pd);
  prevS=snake.map(p=>({...p}));
  let h={x:snake[0].x+dir[0],y:snake[0].y+dir[1]};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N){
    const hd=snake[0],o=[[dir[1],-dir[0]],[-dir[1],dir[0]]].filter(d=>{const x=hd.x+d[0],y=hd.y+d[1];return x>=0&&y>=0&&x<N&&y<N});
    if(!o.length)return;
    o.sort((a,b)=>Math.hypot(hd.x+a[0]-C,hd.y+a[1]-C)-Math.hypot(hd.x+b[0]-C,hd.y+b[1]-C));
    dir=o[0];queue=[];h={x:hd.x+dir[0],y:hd.y+dir[1]};
  }
  const i=foods.findIndex(f=>f.x===h.x&&f.y===h.y);
  if(enemies.some(e=>e.body.some(p=>p.x===h.x&&p.y===h.y)))hurt(2,2000,true);
  if(dead)return;
  snake.unshift(h);snake.pop();
  const gi=gateAt(h);if(gi>=0)return go(gi);
  const hv=hz[h.y*N+h.x];if(hv)hurt(hv===2?1:MAPS[mapId].dmg,1000);
  if(i>=0&&!dead)eat(foods.splice(i,1)[0]);
}

    if(t>=nextY){spawn(t,32,4000,()=>'y',14);nextY+=6000}
    if(t>=nextS){spawn(t,2,6000,special);nextS+=4000}
    foods=foods.filter(f=>t-f.born<f.life);
    const dt=t-last;acc+=dt;eacc+=dt;last=t;
    const base=Math.max(70,TICK-8*boost),tk=curTk=t<fx.spd?Math.max(45,base*.6):base;
    while(acc>=tk&&!dead){acc-=tk;step()}
    for(const e of enemies){e.acc+=dt;e.tk=t<e.fast?efast():ebase();while(e.acc>=e.tk&&!dead){e.acc-=e.tk;enemyStep(e)}}
    const s=(u,ic)=>t<u?ic+Math.ceil((u-t)/1000)+' ':'';
    $('fx').textContent=s(fx.spd,'💨')+s(fx.frz,'❄️');
  }
  draw();requestAnimationFrame(loop);
}
const shiftT=d=>{fx.spd+=d;fx.frz+=d;hurtUntil+=d;stunUntil+=d;nextY+=d;nextS+=d;foods.forEach(f=>f.born+=d);enemies.forEach(e=>{if(e.fast)e.fast+=d})};
const ebase=()=>Math.max(55,ETICK-14*level),efast=()=>Math.max(40,ebase()*.63);
function addEnemy(){
  if(enemies.length>=12)return;
  const hd=snake[0],occ=new Set(enemies.flatMap(e=>e.body).map(p=>p.x+','+p.y));
  const c=POS.filter(([x,y])=>![0,1,2].some(k=>occ.has((x-k)+','+y))).sort((a,b)=>tdist({x:b[0],y:b[1]},hd)-tdist({x:a[0],y:a[1]},hd))[0];
  if(!c)return;const [x,y]=c,b=[{x,y},{x:x-1,y},{x:x-2,y}];
  enemies.push({body:b,prev:b.map(p=>({...p})),dir:[1,0],acc:0,tk:ETICK,fast:0,amb:Math.random()<.3});
}
function checkLevel(){
  const lv=Math.floor(score/100);
  while(level<lv){level++;addEnemy();if(!foods.some(f=>f.type==='k'))spawn(now,1,15000,()=>'k',1);banner('🏆 Nível '+level+'! Mais uma inimiga e mais rápidas. Pegue o raio preto 🖤');sfx('trophy')}
}
let AC=null,mt=null,mi=0,nt=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
function sfx(k){
  if(!cfg.snd||!ac())return;const t=AC.currentTime,q=(f,o,d,ty,v,f2)=>tone(f,t+o,d,ty||'square',v||.09,f2);
  if(k==='y'){q(880,0,.08);q(1320,.07,.12)}
  else if(k==='g')q(400,0,.3,'sawtooth',.08,1400);
  else if(k==='b')q(1600,0,.35,'sine',.12,500);
  else if(k==='r'){q(523,0,.1);q(659,.1,.1);q(784,.2,.2)}
  else if(k==='k'){q(300,0,.2,'sawtooth',.1,900);q(900,.15,.25,'square',.08)}
  else if(k==='hurt')q(220,0,.3,'sawtooth',.12,60);
  else if(k==='gate'){q(330,0,.12,'triangle',.12);q(660,.12,.22,'triangle',.12)}
  else if(k==='trophy')[523,659,784,1047,784,1047].forEach((f,i)=>q(f,i*.11,.16));
  else if(k==='dead')[392,370,349,330,294,262,196].forEach((f,i)=>q(f,i*.2,.3,'triangle',.14));
}
const MEL=[[523,659,784,659,523,659,784,1047,988,784,659,784,880,784,659,523],[440,523,659,523,440,523,659,880,784,659,523,659,698,659,523,440]],BAS=[131,0,196,0,175,0,196,0,147,0,196,0,131,0,196,0];
function music(){
  if(mt||!cfg.snd||!ac())return;nt=AC.currentTime+.1;mi=0;
  mt=setInterval(()=>{while(nt<AC.currentTime+.3){const i=mi%16,m=MEL[Math.floor(mi/16)%2];tone(m[i],nt,.17,'square',.035);if(BAS[i])tone(BAS[i],nt,.36,'triangle',.06);mi++;nt+=.19-Math.min(.06,.008*level)}},70);
}
function stopMusic(){clearInterval(mt);mt=null}
let sx=0,sy=0,sw=false;
cv.addEventListener('pointerdown',e=>{if(cfg.ctl!=='swipe')return;sw=true;sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));sx=e.clientX;sy=e.clientY;
});
const swUp=()=>{sw=false};cv.addEventListener('pointerup',swUp);cv.addEventListener('pointercancel',swUp);
function applyCtl(){
  const sw=cfg.ctl==='swipe',fp=cfg.view==='tp';
  $('pad').style.display=sw?'none':'grid';$('u').style.visibility=$('d').style.visibility=fp?'hidden':'';
  $('hint').textContent=sw?(fp?'Deslize para os lados para virar e começar':'Deslize o dedo na tela para começar'):(fp?'Use ◀ ▶ para virar e começar':'Use os botões para começar');
  $('hint').style.bottom=sw?'40%':'';
}
function viewUI(){
  $('v1').classList.toggle('sel',cfg.view==='top');$('v2').classList.toggle('sel',cfg.view==='tp');
  $('vdesc').textContent=cfg.view==='tp'?'A câmera fica atrás da cobra, como em jogo de ação. ◀ vira para a esquerda dela e ▶ para a direita.':'Visão de cima, como estava.';
}
$('v1').onclick=()=>{cfg.view='top';save();viewUI();applyCtl()};
$('v2').onclick=()=>{cfg.view='tp';save();viewUI();applyCtl()};
function ctlUI(){
  $('c1').classList.toggle('sel',cfg.ctl==='pad');$('c2').classList.toggle('sel',cfg.ctl==='swipe');
  $('cdesc').textContent=cfg.ctl==='swipe'?'Deslize o dedo para cima, baixo ou para os lados e a cobra segue.':'Cruz de botões redondos na parte de baixo da tela.';
}
const recUI=()=>{$('rec').textContent='🏅 Recorde: '+cfg.best};
const sndUI=()=>{$('snd').textContent=cfg.snd?'🔊 Som: ligado':'🔇 Som: desligado'};
$('c1').onclick=()=>{cfg.ctl='pad';save();ctlUI();applyCtl()};
$('c2').onclick=()=>{cfg.ctl='swipe';save();ctlUI();applyCtl()};
$('snd').onclick=()=>{cfg.snd=!cfg.snd;save();sndUI();if(!cfg.snd)stopMusic()};
const padEl=$('pad');let lastK=null,padOn=false;
function padDir(e){
  const r=padEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  const k=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
  if(k!==lastK){lastK=k;turn(k);for(const b of['u','d','l','r'])$(b).classList.toggle('on',b===k)}
}
const padUp=()=>{padOn=false;lastK=null;for(const b of['u','d','l','r'])$(b).classList.remove('on')};
padEl.addEventListener('pointerdown',e=>{e.preventDefault();padOn=true;lastK=null;padDir(e)});
padEl.addEventListener('pointermove',e=>{if(padOn)padDir(e)});
padEl.addEventListener('pointerup',padUp);padEl.addEventListener('pointercancel',padUp);
$('re').onclick=()=>{reset();music()};
const hidePm=()=>{paused=false;$('pm').style.display='none'};
$('pbtn').onclick=()=>{if(dead||inMenu)return;paused=true;stopMusic();$('pm').style.display='flex'};
$('pc').onclick=()=>{hidePm();music()};
$('pr').onclick=()=>{hidePm();reset();music()};
$('pmn').onclick=()=>{hidePm();stopMusic();recUI();show(true)};
const show=m=>{inMenu=m;$('menu').style.display=m?'flex':'none'};
$('play').onclick=()=>{ac();show(false);reset();music()};
$('mn').onclick=()=>{stopMusic();recUI();show(true)};
const panel=id=>{for(const q of['mhome','medit','mctl','mview'])$(q).style.display=q===id?'flex':'none'};
$('edit').onclick=()=>{names();panel('medit');sws($('swme'),ME,'me');sws($('swfoe'),FOE,'foe')};
$('ctl').onclick=()=>{ctlUI();panel('mctl')};
$('viewb').onclick=()=>{viewUI();panel('mview')};$('back3').onclick=()=>panel('mhome');
$('back').onclick=()=>panel('mhome');$('back2').onclick=()=>panel('mhome');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();turn(m)}});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#menu'))e.preventDefault()},{passive:false});
applyCtl();sndUI();recUI();reset();requestAnimationFrame(loop);
</script>
</body>
